[package]
name = "tauri-plugin-sorai-downloader"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SORAI Toolkit downloader as a Tauri v2 plugin (consumed by the sorai-toolkit hub)"
# Required by tauri-plugin's build script so the host app sees our permissions.
links = "tauri-plugin-sorai-downloader"

[dependencies]
tauri = "2.12"
# Sidecars (yt-dlp, ffmpeg) are declared and bundled by the host app; we only
# call them by name through the shell plugin the host registers.
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-plugin = { version = "2.7", features = ["build"] }
